name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  # The coverage comment step below posts to the pull request thread.
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone (the actions/checkout@v4 default) leaves
          # refs/remotes/origin/HEAD unset and the fallback branches absent,
          # so --min-diff's default reference has no merge base to resolve
          # against on this repository's first pull request (D-43).
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -o plumb ./cmd/plumb
      - run: ./plumb report coverage.out --out coverage.html
      # Comment before the gates below: a failed gate stops the job, and
      # the comment is most useful on exactly the run that failed. A
      # comment from a fork has no write token, so a failure here never
      # fails the build.
      - name: coverage comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./plumb check coverage.out --min-statements 85 --min-diff 80 --format=markdown \
            | gh pr comment "${{ github.event.pull_request.number }}" -F -
      - name: coverage gate
        id: coverage-gate
        run: ./plumb check coverage.out --min-statements 85
      - name: diff coverage gate
        id: diff-coverage-gate
        run: ./plumb check coverage.out --min-diff 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.html
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$files" ]; then
            echo "These files are not gofmt'd:"
            echo "$files"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # plumb's own action, run against itself. The test job gates plumb with
  # the binary built from this commit; this job proves action.yml still
  # installs a released plumb and drives it. "uses: ./" runs the action
  # file from this branch, so a change that breaks it fails here instead
  # of on somebody else's build. comment is off — the test job already
  # comments, and two per push would bury each other.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go test -coverprofile=coverage.out ./...
      - id: plumb
        uses: ./
        with:
          profile: coverage.out
          min-statements: 85
          min-diff: 80
          comment: false
      - name: The action must report what it measured
        # Read every value through the environment, never through a shell
        # interpolation: an expression pasted into a script runs as script.
        env:
          PASS: ${{ steps.plumb.outputs.pass }}
          STATEMENTS: ${{ steps.plumb.outputs.statements }}
          JSON: ${{ steps.plumb.outputs.json }}
        run: |
          set -euo pipefail
          test "${PASS}" = "true"
          test -n "${STATEMENTS}"
          printf '%s' "${JSON}" | jq -e '.statements.coverage' > /dev/null
          echo "the action reported ${STATEMENTS}% statements"
          # The diff output is deliberately not asserted non-empty. On a
          # push to master the merge base is the commit itself, so no
          # coverable line changed and D-37 reports null rather than 0.
