name: release
on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build binaries
        run: |
          VERSION=$(git rev-parse --short HEAD)
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-amd64       ./cmd/plumb
          GOOS=linux   GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-arm64       ./cmd/plumb
          GOOS=darwin  GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-amd64      ./cmd/plumb
          GOOS=darwin  GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-arm64      ./cmd/plumb
          GOOS=windows GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-windows-amd64.exe ./cmd/plumb

      - name: Update CHANGELOG
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y-%m-%d)
          SUBJECT=$(git log -1 --pretty=format:"%s")
          BODY=$(git log -1 --pretty=format:"%b")

          {
            echo "## ${DATE} (${SHA})"
            echo ""
            echo "- ${SUBJECT}"
            if [ -n "${BODY}" ]; then
              echo ""
              echo "${BODY}"
            fi
          } > /tmp/release_notes.md

          tail -n +2 CHANGELOG.md > /tmp/changelog_tail.md
          {
            echo "## [Unreleased]"
            echo ""
            cat /tmp/release_notes.md
            echo ""
            cat /tmp/changelog_tail.md
          } > CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG [skip ci]"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}
          name: ${{ github.sha }}
          body_path: /tmp/release_notes.md
          files: dist/*
