name: release

# A release is an act you take, not a side effect of a push. Tag the
# commit you want to release and push the tag:
#
#   edit VERSION, write the CHANGELOG section, commit
#   git tag v0.1.4 && git push origin v0.1.4
#
# The tag is the released tree, so the tag can never name a commit
# other than the one this job builds.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Two tags pushed together must not build at the same time and race
# on the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # The tag and the VERSION file must agree. A binary that reports
      # a version other than its own tag is worse than a failed build.
      - name: Check the tag against VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE_VERSION="v$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match VERSION (${FILE_VERSION}). Update VERSION, commit, then move the tag."
            exit 1
          fi
          echo "VERSION=${TAG}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # plumb gates its own release on its own coverage.
      - name: Coverage gate
        run: |
          go test -coverprofile=coverage.out ./...
          go build -o plumb-gate ./cmd/plumb
          ./plumb-gate check coverage.out --min-statements 85
          rm -f plumb-gate coverage.out

      # The notes are the CHANGELOG section a human wrote for this
      # version. A commit message is internal reasoning, not a release
      # note, so this job never writes the CHANGELOG itself.
      - name: Take the release notes from the CHANGELOG
        run: |
          awk -v want="## ${VERSION} " '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "::error::CHANGELOG.md holds no section for ${VERSION}. Write the notes before you tag."
            exit 1
          fi
          echo "Release notes for ${VERSION}:"
          cat /tmp/release_notes.md

      - name: Build binaries
        run: |
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-amd64       ./cmd/plumb
          GOOS=linux   GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-arm64       ./cmd/plumb
          GOOS=darwin  GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-amd64      ./cmd/plumb
          GOOS=darwin  GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-arm64      ./cmd/plumb
          GOOS=windows GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-windows-amd64.exe ./cmd/plumb

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          files: dist/*
