name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Bump patch version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION
          echo "VERSION=v${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          LDFLAGS="-X main.version=${VERSION}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-amd64       ./cmd/plumb
          GOOS=linux   GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-linux-arm64       ./cmd/plumb
          GOOS=darwin  GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-amd64      ./cmd/plumb
          GOOS=darwin  GOARCH=arm64  go build -ldflags "${LDFLAGS}" -o dist/plumb-darwin-arm64      ./cmd/plumb
          GOOS=windows GOARCH=amd64  go build -ldflags "${LDFLAGS}" -o dist/plumb-windows-amd64.exe ./cmd/plumb

      - name: Update CHANGELOG
        run: |
          DATE=$(date +%Y-%m-%d)
          SUBJECT=$(git log -1 --pretty=format:"%s")
          BODY=$(git log -1 --pretty=format:"%b")

          {
            echo "## ${VERSION} (${DATE})"
            echo ""
            echo "- ${SUBJECT}"
            if [ -n "${BODY}" ]; then
              echo ""
              echo "${BODY}"
            fi
          } > /tmp/release_notes.md

          {
            cat /tmp/release_notes.md
            echo ""
            cat CHANGELOG.md
          } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore: release ${VERSION} [skip ci]"
          git push

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: /tmp/release_notes.md
          files: dist/*
