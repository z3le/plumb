<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plumb — coverage report</title>
<style>
  :root {
    --bg:          #0d1117;
    --bg-panel:    #161b22;
    --bg-hover:    #1c2128;
    --bg-selected: #1f2937;
    --border:      #30363d;
    --text:        #e6edf3;
    --text-muted:  #7d8590;
    --text-dim:    #484f58;
    --green:       #1a4731;
    --green-text:  #3fb950;
    --red:         #4a1e1e;
    --red-text:    #f85149;
    --yellow:      #3a2f00;
    --yellow-text: #d29922;
    --blue:        #1d4ed8;
    --badge-bg:    #21262d;
    --font-mono:   "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    --font-sans:   -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --radius:      6px;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:          #ffffff;
      --bg-panel:    #f6f8fa;
      --bg-hover:    #eaeef2;
      --bg-selected: #dbeafe;
      --border:      #d0d7de;
      --text:        #1f2328;
      --text-muted:  #656d76;
      --text-dim:    #9198a1;
      --green:       #dafbe1;
      --green-text:  #1a7f37;
      --red:         #ffebe9;
      --red-text:    #cf222e;
      --yellow:      #fff8c5;
      --yellow-text: #9a6700;
      --badge-bg:    #eaeef2;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header h1 span.logo {
    color: var(--green-text);
    font-family: var(--font-mono);
  }

  .summary-bar {
    display: flex;
    gap: 20px;
    margin-left: auto;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    font-family: var(--font-mono);
    line-height: 1;
  }

  .stat-value.good  { color: var(--green-text); }
  .stat-value.ok    { color: var(--yellow-text); }
  .stat-value.bad   { color: var(--red-text); }

  /* ── Main layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── File panel ── */
  .file-panel {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-toolbar {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .search-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px;
    width: 100%;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--green-text);
  }

  .sort-row {
    display: flex;
    gap: 4px;
  }

  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10px;
    padding: 3px 7px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .sort-btn.active {
    background: var(--bg-hover);
    border-color: var(--green-text);
    color: var(--green-text);
  }

  .file-list {
    overflow-y: auto;
    flex: 1;
  }

  .file-item {
    cursor: pointer;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .file-item:hover    { background: var(--bg-hover); }
  .file-item.selected { background: var(--bg-selected); }

  .file-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .file-pkg {
    font-size: 9px;
    color: var(--text-dim);
    display: block;
  }

  .pct-pill {
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .pct-pill.good   { background: var(--green); color: var(--green-text); }
  .pct-pill.ok     { background: var(--yellow); color: var(--yellow-text); }
  .pct-pill.bad    { background: var(--red); color: var(--red-text); }

  /* ── Source panel ── */
  .source-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .source-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .source-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
  }

  .source-stats {
    display: flex;
    gap: 10px;
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
  }

  .source-stats span { font-family: var(--font-mono); }
  .source-stats .hi  { color: var(--green-text); font-weight: 600; }

  /* func table */
  .func-table-wrap {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }

  .func-table-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .func-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    font-family: var(--font-mono);
  }

  .func-table th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    padding: 2px 8px 4px 0;
    border-bottom: 1px solid var(--border);
  }

  .func-table td {
    padding: 3px 8px 3px 0;
    border-bottom: 1px solid var(--border);
  }

  .func-table tr:last-child td { border-bottom: none; }

  .func-table td.count { color: var(--green-text); font-weight: 600; }
  .func-table td.count.zero { color: var(--red-text); }
  .func-table td.lineno { color: var(--text-dim); }
  .func-table td.name   { color: var(--text); }

  /* source code */
  .source-scroll {
    overflow: auto;
    flex: 1;
  }

  .source-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
  }

  .source-table tr { position: relative; }

  .source-table tr.covered   { background: rgba(26,71,49,0.35); }
  .source-table tr.uncovered { background: rgba(74,30,30,0.45); }
  .source-table tr.func-badge-row {
    background: none !important;
  }

  .source-table tr:hover { filter: brightness(1.15); }

  .lineno {
    color: var(--text-dim);
    padding: 0 12px 0 16px;
    text-align: right;
    user-select: none;
    white-space: nowrap;
    width: 1%;
    border-right: 1px solid var(--border);
    vertical-align: top;
  }

  .hitcount {
    color: var(--text-dim);
    padding: 0 10px;
    text-align: right;
    user-select: none;
    white-space: nowrap;
    width: 1%;
    vertical-align: top;
    font-size: 10px;
  }

  .hitcount.hit  { color: var(--green-text); }
  .hitcount.miss { color: var(--red-text); }

  .source-line {
    padding: 0 16px 0 4px;
    white-space: pre;
  }

  /* function call badge injected above func declarations */
  .func-badge-cell {
    padding: 4px 4px 2px 4px;
    font-size: 10px;
  }

  .func-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--badge-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1px 7px;
    font-family: var(--font-mono);
    font-size: 10px;
  }

  .func-badge .fname { color: var(--text-muted); }
  .func-badge .fcalls { font-weight: 700; }
  .func-badge .fcalls.hit  { color: var(--green-text); }
  .func-badge .fcalls.miss { color: var(--red-text); }

  /* syntax colours (simplified) */
  .kw  { color: #ff7b72; }   /* keyword */
  .fn  { color: #d2a8ff; }   /* function name */
  .ty  { color: #79c0ff; }   /* type */
  .st  { color: #a5d6ff; }   /* string */
  .cm  { color: #8b949e; font-style: italic; } /* comment */
  .nu  { color: #f0883e; }   /* number */
  .pk  { color: #ffa657; }   /* package/field */

  /* empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 8px;
  }

  .empty-state p { font-size: 13px; }
  .empty-state small { font-size: 11px; color: var(--text-dim); }
</style>
</head>

        </table>
      </div>
      <div class="source-scroll">
        <table class="source-table" id="source-table"></table>

    </div>
  </div>

</div>

// ── State ────────────────────────────────────────────────────────────────────

let currentSort = 'pct';
let currentFile = null;

// ── Init ─────────────────────────────────────────────────────────────────────

function pctClass(p) {
  if (p >= 80) return 'good';
  if (p >= 50) return 'ok';
  return 'bad';
}

function fmt(p) { return p.toFixed(1) + '%'; }

function renderFileList() {
  const query = document.getElementById('search').value.toLowerCase();
  const list  = document.getElementById('file-list');

  let items = files.filter(f => f.name.toLowerCase().includes(query));

  if (currentSort === 'pct')  items.sort((a,b) => a.stmtPct - b.stmtPct);
  if (currentSort === 'func') items.sort((a,b) => a.funcPct - b.funcPct);
  if (currentSort === 'name') items.sort((a,b) => a.name.localeCompare(b.name));

  list.innerHTML = items.map(f => `
    <div class="file-item ${currentFile === f ? 'selected' : ''}"
         onclick="selectFile(files.find(x=>x.name==='${f.name}'))">
      <div class="file-name">
        <span class="file-pkg">${f.pkg.split('/').slice(-2).join('/')}</span>
        ${f.name}
      </div>
      <span class="pct-pill ${pctClass(f.stmtPct)}">${fmt(f.stmtPct)}</span>
    </div>
  `).join('');
}

function selectFile(f) {
  currentFile = f;
  renderFileList();

  document.getElementById('empty-state').style.display = 'none';
  const sv = document.getElementById('source-view');
  sv.style.display = 'flex';

  document.getElementById('source-title').textContent = f.pkg.split('/').slice(-1)[0] + '/' + f.name;
  document.getElementById('src-stmt-pct').textContent = fmt(f.stmtPct);
  document.getElementById('src-stmt-pct').className = 'hi';
  document.getElementById('src-func-pct').textContent = fmt(f.funcPct);

  // func table
  const tbody = document.getElementById('func-tbody');
  tbody.innerHTML = f.funcs.map(fn => `
    <tr>
      <td class="name">${fn.name}</td>
      <td class="lineno">${fn.line}</td>
      <td class="count ${fn.calls === 0 ? 'zero' : ''}">${fn.calls === 0 ? '✗ 0' : '×' + fn.calls}</td>
    </tr>
  `).join('');

  // source table
  const tbl = document.getElementById('source-table');
  tbl.innerHTML = f.lines.map(l => {
    let rows = '';

    if (l.funcBadge) {
      const b = l.funcBadge;
      const cls = b.calls > 0 ? 'hit' : 'miss';
      const label = b.calls > 0 ? `×${b.calls}` : '✗ not called';
      rows += `<tr class="func-badge-row">
        <td class="lineno"></td>
        <td class="hitcount"></td>
        <td class="func-badge-cell" colspan="1">
          <span class="func-badge">
            <span class="fname">${b.name}</span>
            <span class="fcalls ${cls}">${label}</span>
          </span>
        </td>
      </tr>`;
    }

    const covClass = l.cov || '';
    const hitClass = l.cov === 'covered' ? 'hit' : l.cov === 'uncovered' ? 'miss' : '';
    const countStr = l.cov === 'covered' ? l.count : l.cov === 'uncovered' ? '0' : '';

    rows += `<tr class="${covClass}">
      <td class="lineno">${l.n}</td>
      <td class="hitcount ${hitClass}">${countStr}</td>
      <td class="source-line">${l.src}</td>
    </tr>`;

    return rows;
  }).join('');
}

function filterFiles() { renderFileList(); }

function sortFiles(by) {
  currentSort = by;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + by).classList.add('active');
  renderFileList();
}

// kick off
renderFileList();
</script>
